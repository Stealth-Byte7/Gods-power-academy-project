<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Online Admission Form - God's Power Academy</title>
    <style>
        /* --- Global Reset & Page Centering --- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background-color: #F7F4EB; /* Matches your warm academy cream tone */
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px 20px;
        }

        /* --- Standalone Form Card Structure --- */
        .form-page-card {
            background-color: #FDFBF7; /* Clean off-white surface */
            border-radius: 12px;
            width: 100%;
            max-width: 500px;
            padding: 35px;
            box-shadow: 0 10px 30px rgba(92, 58, 33, 0.08); /* Soft academic depth shadow */
            animation: formFadeIn 0.4s cubic-bezier(0.25, 1, 0.5, 1) forwards;
        }

        @keyframes formFadeIn {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .btn-back-home {
            display: inline-block;
            margin-bottom: 20px;
            color: #0F4C81; /* Brand Blue */
            text-decoration: none;
            font-size: 14px;
            font-weight: 600;
            transition: color 0.2s ease;
        }

        .btn-back-home:hover {
            color: #5C3A21; /* Swaps to Academic Brown on hover */
        }

        .modal-header h2 {
            color: #5C3A21; 
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 10px;
        }

        .modal-intro {
            font-size: 13.5px;
            color: #615E58;
            line-height: 1.5;
            margin-bottom: 25px;
        }

        /* --- Form Inputs Layout --- */
        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: #2C2520;
            margin-bottom: 6px;
        }

        .form-group input,
        .form-group select {
            width: 100%;
            padding: 12px 14px;
            border: 2px solid #EAE5DB;
            border-radius: 6px;
            background-color: #FFFFFF;
            font-family: inherit;
            font-size: 14px;
            color: #1E293B;
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
        }

        .form-group input:focus,
        .form-group select:focus {
            border-color: #0F4C81; 
            box-shadow: 0 0 0 3px rgba(15, 76, 129, 0.1);
            outline: none;
        }

        /* --- Submit Action Button --- */
        .btn-submit-form {
            width: 100%;
            background-color: #0F4C81; 
            color: #FFFFFF;
            border: none;
            padding: 14px;
            border-radius: 6px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            transition: background-color 0.2s ease, transform 0.2s ease;
            margin-top: 10px;
        }

        .btn-submit-form:hover {
            background-color: #0A365C;
            transform: translateY(-1px);
        }

        /* --- Responsiveness Patch for Mobile Devices --- */
        @media (max-width: 480px) {
            body {
                padding: 20px 12px;
            }
            .form-page-card {
                padding: 25px 20px;
            }
            .modal-header h2 {
                font-size: 21px;
            }
            .form-group {
                margin-bottom: 16px;
            }
        }
    </style>
</head>
<body>

    <div class="form-page-card">
        <a href="index.html" class="btn-back-home">&larr; Return to Homepage</a>
        
        <div class="modal-header">
            <h2>Online Admission Form</h2>
        </div>
        <p class="modal-intro">Please fill in the student's details accurately. This will be submitted directly to our registration desk via WhatsApp for instant validation.</p>
        
        <form id="whatsappAdmissionForm">
            <div class="form-group">
                <label for="studentName">Full Name of Ward:</label>
                <input type="text" id="studentName" required placeholder="e.g., Joshua Owolabi">
            </div>
            
            <div class="form-group">
                <label for="admissionLevel">Target Entry Level:</label>
                <select id="admissionLevel" required>
                    <option value="" disabled selected>Select Level</option>
                    <option value="Primary Foundation">Primary Foundation</option>
                    <option value="Junior Secondary (JSS 1)">Junior Secondary (JSS 1)</option>
                    <option value="Junior Secondary (JSS 2)">Junior Secondary (JSS 2)</option>
                    <option value="Junior Secondary (JSS 3)">Junior Secondary (JSS 3)</option>
                </select>
            </div>

            <div class="form-group">
                <label for="parentName">Parent / Guardian Name:</label>
                <input type="text" id="parentName" required placeholder="Mr/Mrs. (Name)">
            </div>

            <div class="form-group">
                <label for="parentLocation">Residential Address / Area:</label>
                <input type="text" id="parentLocation" required placeholder="Mabolaje Area, Oyo">
            </div>

            <button type="submit" class="btn-submit-form">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="margin-right: 8px; vertical-align: middle;"><path d="M22 2L11 13M22 2l-7 20-4-9-9-4 20-7z"/></svg>
                Submit to Registration Desk
            </button>
        </form>
    </div>

    <script src="script.js"></script>
</body>
</html>
